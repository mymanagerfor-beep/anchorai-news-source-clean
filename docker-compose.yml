services:
  mongo:
    image: mongo:7
    volumes: ["mongo:/data/db"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports: ["8001:8001"]
    depends_on: [mongo]
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    ports: ["3000:80"]
volumes:
  mongo: {}
